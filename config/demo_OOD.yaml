
task_name: CIDM_real # CIDM_stimulated
output_path:  ./

data:
  data_dir: /home/dongjiayi/workbench/denoise/data/
  data_name: pbmc
  version: ""
  cov_type: condition
  batch_name: condition
  condition_name: condition
  state_name: cellstate
  type_name: cellstate
  is_raw_data: false
  n_top_features: 0
  batch_scale: false
  vis: true

log:
  stdout: false
  stderr: false
  tensorboard: true

model:
  mlp_width: 512
  mlp_depth: 8
  mlp_ac: 0.2
  mlp_dropout: 0.2

  # lambda_l1: 1
  lambda_rec: 0.1
  lambda_kl1: 0.0001
  lambda_kl2: 0.01
  lambda_kl3: 0.001
  lambda_tc: 1
  lambda_align: 2 # 5

  h_tol: 0.00000001
  rho_max: 1000.0
  rho: 1.0
  alpha: 5.0
  lambda_l2: 0.01
  lambda_l1: 0.01
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.00001

  dag_anneal_steps: 100
  adv_step: 5
  
  val_split: 0
  batch_size: 512

  epochs: 500

  patience: 50
  num_hidden: 1
  nonlinear: false
  loss: bce

reproduc:
  seed: 1
  benchmark: false
  deterministic: true
    
